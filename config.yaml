# Deterministic thresholds — single source of truth (workflow record B3/A5).
# Never recompute, alter, or soften these in LLM steps. Version-controlled via git.

thresholds:
  collections_variance: 0.02        # >2% -> flag for review
  disbursement_abs: 100             # > $100 absolute -> investigate
  disbursement_pct: 0.05            # or >5% -> investigate
  cash_balance_variance: 0.01       # >1% -> escalate to manual verification
  anomaly_score_high: 0.75          # >=0.75 -> forensic review route
  pdf_confidence_floor: 0.85        # <85% -> manual spot-check
  transaction_volume_multiple: 10   # frequency anomaly (10x normal)
  round_dollar_materiality_multiple: 3   # round amount must also be >3x median to flag
  gateway_fee_max_pct: 0.05         # SOP-2: reported-vs-net gap this small or less is a plausible gateway fee, not a raw variance
  sequence_jump_multiple: 10        # an amount this many times an account's own trailing average flags (not the portfolio median)
  sequence_jump_min_window: 3       # need >= this many prior same-account rows before judging a "pattern"
  off_hours_start_hour: 22          # off-hours window start (24h) -- only judged when a row's date carries a time component
  off_hours_end_hour: 5             # off-hours window end (24h)
  micro_split_min_count: 3          # >= this many same-account, same-day, similar-size transactions flags possible structuring
  micro_split_amount_tolerance_pct: 0.15   # "similar size" = within this fraction of each other
  micro_split_materiality_multiple: 3      # combined total must also be >3x median to flag

# Per-loan tape column names (dbt_source.<borrower>_source_loans_staging via
# the Redshift dropdown -- NOT the uploaded-file path, which expects the
# `default` names already). Real column names vary a lot by borrower/lender
# data source: a survey of all 46 borrower tables on 2026-09-03
# (docs/loan_tape_column_survey.md) found only 1 ("advance") matches
# `default` exactly on every money/date field. Add an entry under
# `overrides.<borrower>` to fix a borrower without touching code --
# `phase1_ingestion_parsing/ingest.py`'s normalize_loan_tape_row() and
# app/streamlit_app.py's _loan_tape_summary() both resolve through this.
# A field with no real equivalent for a borrower is left unmapped (same as
# today: silently 0 in money sums / omitted from the derived event) --
# see the survey doc for the full per-borrower gap list and candidates.
loan_tape_columns:
  default:
    loan_id: loan_id
    begin_date: begin_date
    principal_amount: principal_amount
    total_loan_amount: total_loan_amount
    principal_outstanding: principal_outstanding
    interest_outstanding: interest_outstanding
    fee_outstanding: fee_outstanding       # singular -- matches real data (leasy et al.); ingest.py
    penalty_outstanding: penalty_outstanding   # used to hardcode the plural form, silently zeroing both (fixed 2026-09-03)
    closure_date: closure_date
    company_due_date: company_due_date
    currency: currency
    status: status
    country: country
    days_past_due: days_past_due
  # Unambiguous renames only (same field, different spelling/formatting) --
  # confirmed by an exact match once underscores are stripped, nothing
  # guessed. See the survey doc for borrowers that need a business call
  # instead (multiple plausible candidates, or no equivalent column at all).
  overrides:
    # Full pass (2026-09-08) against every column of every borrower table
    # (docs/loan_tape_column_survey.md "Full column list per borrower"),
    # not just the field-by-field candidate lists from the original survey.
    # Only 1:1, non-ambiguous matches are applied here. Two fields are never
    # pointed at the same source column (would double-count in aggregation
    # math) -- where that tradeoff existed, only the more literal field got
    # the mapping and the other stays unmapped rather than guessed.
    advance:
      # Real columns are plural ("fees_outstanding"/"penalties_outstanding"),
      # unlike most other borrowers -- the 2026-09-03 singular default fix
      # (see file header) was correct for leasy et al. but broke advance.
      fee_outstanding: fees_outstanding
      penalty_outstanding: penalties_outstanding
      # country: no country column, only `branch` (a different concept) --
      # left unmapped rather than silently relabeling branch as country.
    amartha:
      days_past_due: dpd
      # principal_amount / principal_outstanding: every amartha* table
      # carries BOTH a "_lendable" and a "_loan" variant (e.g.
      # principal_amount_lendable vs principal_amount_loan) -- which one is
      # "the" principal is a real business call (Lendable's own exposure vs
      # the full underlying loan), not something to guess. Pending decision.
    amartha_full:
      days_past_due: dpd
    amartha_full_portfolio:
      days_past_due: dpd
    amartha_secured:
      days_past_due: dpd
    autocheck__ci:
      principal_outstanding: principal_out
      interest_outstanding: interest_out
      fee_outstanding: fees_out
      penalty_outstanding: penalty_out
    autocheck__ug:
      principal_outstanding: principal_out
      interest_outstanding: interest_out
      fee_outstanding: fees_out
      penalty_outstanding: penalty_out
    credismart:
      loan_id: unique_loan_identifier
      begin_date: loan_disbursement_date
      principal_amount: principal
      total_loan_amount: loan_amount
      principal_outstanding: principal_still_outstanding
      interest_outstanding: interest_still_outstanding
      fee_outstanding: other_fees_and_charges_still_outstanding
      company_due_date: loan_due_date
      status: loan_status
      country: country_code
      # penalty_outstanding: no separate column -- likely folded into
      # other_fees_and_charges_still_outstanding already used for fees;
      # left unmapped rather than double-count it.
    dlight:
      # Pay-as-you-go solar financing, not an amortizing loan -- no
      # principal/interest/fee/penalty-outstanding concept in this table.
      loan_id: contractid
      begin_date: contractregistrationdate_dt
      total_loan_amount: contract_totalprice
      closure_date: end_date
      currency: currency_type
      status: baseunit_contractstatus
    exitus:
      principal_amount: principal
      closure_date: end_date
      currency: currency_type
      status: loan_status
    first_circle:
      begin_date: disbursement_date
      principal_amount: loan_amount
    first_digital_finance_corporation:
      # Same plural fees/penalties exception as `advance`.
      fee_outstanding: fees_outstanding
      penalty_outstanding: penalties_outstanding
      begin_date: disbursed_date
      principal_amount: principal
      closure_date: closed_date
      company_due_date: first_due_date
      # `loan_status` (text) is NULL on every row checked (0/200 live sample) --
      # `loan_status_id` is fully populated but is a numeric code (e.g. 300,
      # 600) with no legend in this table. Mapped anyway: a coded value a
      # reviewer can look up beats a permanently blank tile, but this should
      # be confirmed with FDFC/whoever owns the code list.
      status: loan_status_id
    khazna:
      principal_amount: priciple_amount   # source column is itself a typo (missing "n")
    koinworks:
      begin_date: disbursed_date
      principal_outstanding: principal_remaining
      interest_outstanding: interest_remaining
      penalty_outstanding: late_remaining
      closure_date: cleared_date
      # loan_id: `id` (surrogate key?) vs `loan_code` (business id) -- ambiguous, pending business call.
      # principal_amount: only `funding_amount` exists (platform funding, not clearly loan principal) -- left unmapped.
      # fee_outstanding: `total_commission_fee` is commission, not a fee owed by the borrower -- left unmapped.
    leasy:
      currency: currency_type
    lendmn:
      principal_amount: principal
      closure_date: payoff_date
      currency: currency_type
    lendmn_micro:
      principal_amount: principal
      closure_date: payoff_date
      currency: currency_type
    lendmn_revolving:
      principal_amount: principal
      closure_date: payoff_date
      currency: currency_type
    lhoopa:
      # Real-estate acquisition pipeline, not an amortizing loan -- no
      # interest/fee/penalty-outstanding concept in this table.
      loan_id: property_id
      begin_date: property_purchase_date
      principal_amount: property_purchase_amount
      # status: `property_status` vs `construction_status` -- two distinct status concepts, ambiguous which is "the" status. Pending business call.
    metafin:
      begin_date: emi_begin_date   # matches redshift-api's LOAN_TAPE_DATE_COLUMN_OVERRIDES for this borrower
      closure_date: emi_end_date
      status: loan_status
    mkopa:
      loan_id: loanid
      begin_date: loanstartdate
      closure_date: loanenddate
      # principal_amount/total_loan_amount/principal_outstanding/interest_outstanding/
      # fee_outstanding/penalty_outstanding: this table has NO monetary columns at
      # all (pay-as-you-go product) -- genuinely $0 in the summary, not a mapping gap.
    moladin:
      begin_date: start_date
      principal_amount: amount
      principal_outstanding: principal_remaining
      closure_date: end_date
      status: loan_status
      # loan_id: `active_loan_id` vs `loan_submission_id` -- ambiguous, pending business call.
    moladin_property:
      begin_date: start_date
      # total_loan_amount: the only amount column bundles principal+interest+origination
      # fee together (no clean principal-only figure exists) -- mapped to "total" since
      # that's the more honest label for a bundled figure; principal_amount left unmapped.
      total_loan_amount: amount__principal___interest___origination_fee_
      principal_outstanding: principal_remaining
      closure_date: end_date
    mottu:
      # Vehicle-rental product, not an amortizing loan.
      loan_id: contractid
      begin_date: begindate
      total_loan_amount: rentalprice
      closure_date: enddate
      company_due_date: duedate
      status: contractsituation
    mufin:
      loan_id: loan_number
      begin_date: loan_date
      principal_amount: loan_amount
      # principal_outstanding / interest_outstanding / days_past_due: real columns exist
      # (`principal_outstanding_as_on_december_31_2025` etc.) but are hard-coded to a
      # single snapshot date -- this looks like a one-off year-end extract rather than a
      # rolling loan tape. Left unmapped: wiring a dated column name would silently break
      # (or silently go stale) the next time mufin's source rolls to a new period.
    payjoy:
      loan_id: loansourceid
      begin_date: origination_date
      principal_amount: financeamount
      status: financestatus
    payjoy_full:
      loan_id: loansourceid
      begin_date: origination_date
      principal_amount: financeamount
      status: financestatus
    payjoy_secured:
      loan_id: loansourceid
      begin_date: origination_date
      principal_amount: financeamount
      status: financestatus
    payjoy_ecuador:
      begin_date: date
      principal_amount: principal_of_loan
      total_loan_amount: size_of_loan
      company_due_date: last_expected_payment_due_date
      status: current_loan_status
    payjoy_sa:
      begin_date: date
      principal_amount: principal_of_loan
      total_loan_amount: size_of_loan
      company_due_date: last_expected_payment_due_date
      status: current_loan_status
    samunnati:
      loan_id: accountnumber
      begin_date: disbursementdate
      principal_amount: total_disbursed_amount
      principal_outstanding: principaloutstanding
      interest_outstanding: totalinterestdue
      company_due_date: maturitydate
      status: accountstatus
      days_past_due: dpd_days
    sary:
      loan_id: loanid
      begin_date: start_date
      principal_amount: invoice_amount
      principal_outstanding: principalbalance
      company_due_date: due_date
      status: loanstatus
      days_past_due: dayspastdue
      # interest_outstanding / penalty_outstanding: candidates `moratetaxincl` /
      # `totalmargintaxincl` use unclear local terminology ("morate" may mean late/penalty
      # interest) -- guessing which is which risks misstating a real figure. Pending business call.
    shara:
      loan_id: id
      principal_amount: principal
      closure_date: payoff_date
      currency: currency_code
    solar_panda:
      loan_id: sale_id
      begin_date: installed_date
      principal_amount: price
      closure_date: end_date
    sugmya_finance:
      principal_amount: principal
      currency: currency_type
      days_past_due: pardays   # "PAR days" (portfolio-at-risk days) = this table's DPD equivalent
    techcoop:
      principal_amount: principal
      closure_date: end_date
    validus_id:
      begin_date: disbursement_date
      total_loan_amount: total_loan
      principal_outstanding: os   # standard finance abbreviation for "outstanding balance"
      company_due_date: maturity_date
      status: repayment_status
      days_past_due: dpd
      # principal_amount: `total_loan` is ambiguous (may already include interest) -- left unmapped.
      # interest_outstanding: `actual_interest_amount` is ambiguous (total vs remaining-outstanding) -- pending business call.
    validus_id_full:
      begin_date: disbursement_date
      total_loan_amount: total_loan
      principal_outstanding: os
      company_due_date: maturity_date
      status: repayment_status
      days_past_due: dpd
    validus_id_lendable:
      begin_date: disbursement_date
      principal_amount: loan_amount
      principal_outstanding: os
      company_due_date: maturity_date
      status: repayment_status
      days_past_due: dpd
      # interest_outstanding: `interest_amount` is ambiguous (total vs remaining-outstanding) -- pending business call.
    validus_id_secured:
      begin_date: disbursement_date
      principal_amount: loan_amount
      principal_outstanding: os
      company_due_date: maturity_date
      status: repayment_status
      days_past_due: dpd
    watu_africa:
      loan_id: external_loan_id
      principal_amount: principal
      currency: currency_type
      status: loan_status
    # advance, f88, khazna, leasy, mkopa, prestamype, r5, solvento already
    # match (or now match, with the overrides above) the default names on
    # every money/date field with no further action needed.

  # Borrowers whose money columns use a live negative-sign accounting
  # convention -- confirmed 2026-09-09 by sampling real rows (not assumed
  # from a sibling table): lendmn/lendmn_revolving's `principal` and
  # autocheck__ci/ug's principal_out/interest_out/fees_out/penalty_out are
  # negative on effectively every row. abs() is applied for these borrowers
  # instead of the default floor-at-0, which would otherwise silently zero
  # out real debt rather than just fix the sign. lendmn_micro is
  # deliberately excluded -- sampled normally signed, unlike its siblings.
  negative_sign_borrowers:
    - lendmn
    - lendmn_revolving
    - autocheck__ci
    - autocheck__ug

# Change-detection watcher (SOP 1 / Option A): polls the Redshift Query API
# for each borrower's loan tape and re-runs the verification pipeline when a
# tool detects the tape has changed. Runs headless, writes a working paper +
# audit log per change. See cash_watcher.py. Data-driven so poll cadence,
# target borrowers and the cut-off guard are config-only.
sop1:
  watcher:
    enabled: true                  # master switch; set true to let the watcher run
    interval_seconds: 600          # poll cadence (default 10 min)
    state_file: out/cash_watcher_state.json
    tape_fetch_limit: 0                # rows per borrower per poll; 0 = fetch the full tape
    run_on_change: true            # re-run the full pipeline when a change is detected
    # Target borrowers to watch. Empty list = watch every borrower the API
    # exposes (from /borrowers). Only genuine change moves a borrower forward.
    # Scoped to a small, run-weight-safe set for the scheduled runs: each
    # borrower in this list has its FULL tape fetched once per poll, so the
    # per-poll load on the local redshift-api + Redshift grows linearly with
    # the list length (a heavy full-sweep caused transient timeouts/500s in
    # the 2026-09-08 audit -- see docs/loan_tape_field_population_audit.md).
    #
    # Selection rule (checked against the code, not just docs): a borrower is
    # a useful watcher target only if `normalize_loan_tape_row` (ingest.py)
    # actually derives events from its mapped columns -- i.e. it maps BOTH a
    # `principal_amount` (disbursement) AND a `total_loan_amount` (collections)
    # column in `loan_tape_columns` below. Borrowers with no money mapping
    # would still pass change-detection (row-count/content hash) but every
    # change-triggered run would produce an empty aggregate -- a meaningless
    # working paper. `leasy` and `credismart` are the two whose config maps
    # both sides completely, so both events are produced.
    #
    # Deliberately NOT watched: metafin/payjoy*/advance (money columns
    # unmapped or partial -- no valid collections event), the 6 persistently
    # 0-row borrowers (mkopa, amartha2, amartha_full, amartha_full_portfolio,
    # validus_id_full, validus_id_lendable), and borrowers still awaiting a
    # business call on ambiguous columns (amartha*, koinworks, moladin,
    # lhoopa, sary, validus_id*). Revert to [leasy] if the added load is too
    # heavy.
    borrowers: [leasy, credismart]
    # Cut-off guard: if the tape's latest begin_date is *after* this date
    # (YYYY-MM-DD) when a change is detected, treat it as a post-cut-off
    # update. "hard_stop" refuses to run (flags) vs "backdate" re-runs but
    # marks the run as post-cut-off in the audit log. Leave empty to disable.
    cut_off_date: ""
    cut_off_mode: "backdate"       # "hard_stop" | "backdate"
    # SOP-1 Step 4 ("Reconciliation & Cut-Off Matching") literally specifies
    # "Flag discrepancies > 0.01%" -- 100x tighter than the general
    # cash_balance_variance (1%, thresholds.cash_balance_variance above) used
    # by every other reconciliation in the app. Scoped to this watcher only
    # (not the shared threshold) so the Run tab / CLI aren't suddenly flagging
    # ordinary FX/rounding noise across every other borrower and entry point.
    cash_discrepancy_pct: 0.0001   # 0.01%
    # Reported totals the pipeline reconciles against. Leave empty to derive
    # from the tape itself (same as the Streamlit dropdown path).
    reported: {}
    # Report email delivery: after every change-triggered run, the working
    # paper (.md + .json) is emailed to `to_addrs` via the Gmail API (OAuth,
    # gmail.send scope) — no SMTP app password needed, so it works on corporate
    # Google Workspace accounts where the admin has disabled app passwords. The
    # disk write remains the audit trail; email is additional delivery. One-time
    # setup: `python scripts/google_oauth_setup.py --feature gmail` (grants gmail.send,
    # token saved to GOOGLE_OAUTH_GMAIL_TOKEN_JSON in .env). Keep enabled:false
    # until a real authenticated send is verified (repo rule: no external
    # integration goes live on config alone).
    email:
      enabled: true
      gmail_token_env: "GOOGLE_OAUTH_GMAIL_TOKEN_JSON"
      from_addr: "nephy@lendable.io"      # the Google account that sends
      to_addrs: ["nephy@lendable.io"]     # recipient email address(es)
      subject_prefix: "[Verifications] "
    # SOP 1 statement drop-folder: read bank/wallet statements humans place in a
    # Google Drive folder, feed them into reconciliation as the independent side,
    # and retain the raw files as the audit trail. Requires a `drive.readonly`
    # OAuth token (run `python scripts/google_oauth_setup.py --feature inbox` once). Without
    # the token the watcher degrades to tape-only (reconciliation is surfaced as
    # "NOT VERIFIED") instead of crashing. `inbox_folder` is a Drive folder id or
    # name; `folder_by_borrower` overrides per borrower.
    #
    # NOTE: this folder is for STATEMENTS only. The loan-tape "Download as Google
    # Sheet" export uses the separate DRIVE_FOLDER_ID env var (.env) and is
    # unchanged here.
    bank_statements:
      enabled: true
      inbox_folder: "1_ReH5RpdCr0vXfuKMj7KzjOlFjwOo31F"
      # Each borrower reads statements from its OWN Drive subfolder (created
      # under the main folder), so a statement dropped into <borrower>/ is
