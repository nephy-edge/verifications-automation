fx:
  base_currency: USD
  rates: {}   # {CCY: units of base_currency per 1 unit of CCY}, e.g. {"KES": 0.0067}.
              # Live rate lookup (fawazahmed0/currency-api, free, no key) is the DEFAULT
              # in both the Streamlit app and the CLI runner: for every non-base currency
              # present in a run, a live rate is fetched and merged over this table
              # (live wins on overlap). This static table is the offline/fallback source
              # used when live lookup is disabled (CLI --no-live-fx) or unreachable, and
              # is the only source when the network call is skipped for a single-currency
              # run. Never fabricate a plausible-looking rate here (same discipline as
              # vehicle_verify.py's confirmed-only country contracts). A currency present
              # on a row but missing from both sources is left unconverted and surfaced
              # as `unmapped_currencies` in the aggregates.

llm:
  parse_temperature: 0.3
  anomaly_temperature: 0.5
  max_tokens: 4000
  provider: "deepinfra"              # "openai" | "anthropic" | "deepinfra" (leave empty for rules-only, no outbound LLM calls)
  model: "deepseek-ai/DeepSeek-V4-Flash-0731"   # empty -> provider default (see phase0_foundations/llm_client.py _DEFAULT_MODEL)
  deepinfra_base_url: ""            # empty -> "https://api.deepinfra.com/v1/openai" (DeepInfra's confirmed
                                     # OpenAI-compatible base per docs.deepinfra.com/quickstart; the "/openai"
                                     # segment is required and re-added if missing). Override only to point at
                                     # a proxy in front of DeepInfra.
  # provider/model currently power the "Ask (AI)" tab's NL querying
  # (phase4_human_review/query.py, Output 8). API key comes from the
  # provider's own env var (OPENAI_API_KEY / ANTHROPIC_API_KEY /
  # DEEPINFRA_API_KEY), never here. "deepinfra" hosts DeepSeek (and other
  # open) models behind an OpenAI-compatible API — see deepinfra.com/deepseek
  # for other model ids.

# Downstream services the app talks to. URL/key-name are data-driven so infra
# moves (host/port/key renames) never require touching Python code.
services:
  redshift:
    api_url: "http://127.0.0.1:8001"   # redshift-api sibling; trailing slash optional
    api_key_env: "REDSHIFT_API_KEY"     # env var name that holds the API key

# Static web assets referenced by the UI (CDN URLs). Stored as data so a font /
# CDN change is config-only and never a code edit.
assets:
  fonts_url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
  fonts_preconnect: "https://fonts.googleapis.com"
  fonts_gstatic: "https://fonts.gstatic.com"

# Vehicle-registry provider (Verifik). Base URL / confirmed endpoints are
# externalized here so provider or account changes are config-only.
vehicle_registry:
  provider: verifik
  base_url: "https://api.verifik.co"
  base_url_env: "VERIFIK_BASE_URL"     # optional env override of base_url
  token_env: "VERIFIK_TOKEN"           # env var name that holds the bearer token
  timeout_seconds: 15
  param_rename:
    document_type: documentType
    document_number: documentNumber
  confirmed_paths:
    PE: { path: "vehiculo/placa", extra: [] }
    CO: { path: "runt/vehicle-by-plate-simplified", extra: ["document_type", "document_number"] }
    CL: { path: "vehicle", extra: [] }
    AR: { path: "vehicle", extra: [] }
    BR: { path: "vehicle", extra: [] }

# Asset & vehicle verification (app/streamlit_app.py): candidate header names
# for the upload's column-mapping dropdowns, checked in order and matched by
# substring against the uploaded file's actual columns to pick a default --
# the user can always override the suggestion. Add an exporter's own spelling
# here rather than teaching the app a new hardcoded keyword.
asset_verification:
  plate_columns: ["plate", "registration", "asset id", "asset_id"]
  borrower_columns: ["borrower"]
  expected_owner_columns: ["expected_owner", "expected owner", "owner", "propietario"]
  expected_vehicle_columns: ["expected_vehicle", "expected vehicle", "vehicle description", "make model"]

logging:
  path: verifications.log.jsonl

output:
  dir: out
